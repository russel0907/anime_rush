name: anime_rush
description: A gamified anime tracking app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.6 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  google_fonts: ^6.2.1
  flutter_native_splash: ^2.3.2
  http: ^1.1.0
  graphql_flutter: ^5.3.0
  expandable_text: ^2.3.0
  url_launcher: ^6.1.14
  supabase: ^2.0.8

  # State Management
  flutter_riverpod: ^2.4.9

  # Image Caching
  cached_network_image: ^3.3.1

  # Animations
  flutter_animate: ^4.3.0
  shimmer: ^3.0.0
  confetti: ^0.8.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Connectivity
  connectivity_plus: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
